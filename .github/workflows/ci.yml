name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Single root package-lock.json covers all workspaces (client + server)
      - name: Install dependencies
        run: npm ci

      - name: Build client and server
        run: npm run build

      - name: Server tests
        run: npm test --workspace=server

      - name: Client tests
        run: npm test --workspace=client

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  # Builds the production image (Dockerfile) without pushing it, so a broken native module,
  # missing runtime file or Dockerfile error shows up in the PR instead of at deploy time.
  # Then starts it on a throwaway data dir and runs scripts/smoke-test.sh against it.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t credit-cards-app:ci .

      - name: Check native modules and runtime files in the image
        run: |
          docker run --rm --entrypoint sh credit-cards-app:ci -c '
            set -e
            test "$(id -u)" != 0
            node -e "require(\"@node-rs/argon2\"); new (require(\"better-sqlite3\"))(\":memory:\").close(); console.log(require.resolve(\"@riseup-oss/mcp\"))"
            test -f server/dist/index.js && test -f server/dist/cli/reset-password.js && test -f client/dist/index.html'

      - name: Start container and run smoke test
        run: |
          mkdir ci-data && chmod 777 ci-data
          docker run -d --name app -p 127.0.0.1:3000:3000 -v "$PWD/ci-data:/app/data" \
            -e COOKIE_SECURE=false credit-cards-app:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          scripts/smoke-test.sh http://127.0.0.1:3000

      - name: Container logs
        if: always()
        run: docker logs app || true
